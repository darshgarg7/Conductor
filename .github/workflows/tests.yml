name: Research pipeline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,hf,serve,profiling]'
      - run: ruff check .
      - run: pytest -q
      - name: Exercise the support workflow over localhost HTTP
        run: CONDUCTOR_PYTHON=python bash scripts/run_support_demo.sh --output outputs/ci/support
      - name: Preserve support acceptance measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: support-acceptance
          retention-days: 14
          if-no-files-found: warn
          path: |
            outputs/ci/support/run.json
            outputs/ci/support/metrics.json
            outputs/ci/support/service_acceptance.json
            outputs/ci/support/shutdown.json
            outputs/ci/support/tickets.csv
            outputs/ci/support/load_requests.csv
            outputs/ci/support/failure.json
