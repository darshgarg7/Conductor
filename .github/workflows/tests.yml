name: Research pipeline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,hf]'
      - run: ruff check .
      - run: pytest -q
