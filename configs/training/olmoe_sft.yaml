include: ../models/olmoe.yaml
training:
  stage: sft
  data: data/dev/sft.jsonl
  output: outputs/checkpoints/conductor-sft
  epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  router_auxiliary_weight: 0.0  # Optional measured router load-balancing objective.
  scheduler: cosine
  warmup_steps: 0
  save_every_updates: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  validation_fraction: 0.2
  max_grad_norm: 1.0
  save_every_epochs: 1
