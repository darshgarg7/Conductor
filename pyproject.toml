[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-research"
version = "0.2.0"
description = "Sparse learned MoE coordination: post-training and inference experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["torch>=2.5,<3", "PyYAML>=6,<7", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
hf = ["transformers==4.57.6", "peft==0.21.0", "accelerate>=1,<2", "safetensors>=0.4"]
dev = ["pytest>=8,<10", "ruff>=0.9"]
tracking = ["wandb>=0.18"]
serve = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
profiling = ["psutil>=6,<8", "nvidia-ml-py>=12,<14"]

[project.urls]
Repository = "https://github.com/darshgarg7/Conductor"
Documentation = "https://github.com/darshgarg7/Conductor#readme"

[tool.setuptools.packages.find]
include = ["conductor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires a real NVIDIA CUDA device", "distributed: starts a local multi-process test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
