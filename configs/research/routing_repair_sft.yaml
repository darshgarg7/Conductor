# The probe checkpoint supplies its validation-selected pooling/normalization.
# Loading it restores those model options, then enables coordinator LoRA.
include: [../models/granite.yaml]
model:
  state_serialization: priority_v1
  max_length: 256
  local_files_only: true
inference:
  instrument_experts: true
training:
  stage: sft
  data: data/generated/routing-repair/curated/sft.jsonl
  checkpoint: outputs/research/routing-repair/probe/selected
  output: outputs/research/routing-repair/sft
  epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  weight_decay: 0.01
  validation_fraction: 0.25
  max_grad_norm: 1.0
  gradient_checkpointing: false
  scheduler: constant
  save_every_epochs: 1
