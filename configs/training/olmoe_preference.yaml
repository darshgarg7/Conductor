include: ../models/olmoe.yaml
training:
  stage: dpo
  data: data/dev/preferences.jsonl
  checkpoint: outputs/checkpoints/conductor-sft
  output: outputs/checkpoints/conductor-preference
  epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  router_auxiliary_weight: 0.0
  scheduler: cosine
  warmup_steps: 0
  save_every_updates: 100
  learning_rate: 0.00002
  weight_decay: 0.01
  validation_fraction: 0.2
  max_grad_norm: 1.0
  beta: 0.1
